name: Refresh Siteimprove data

on:
  schedule:
    # Spring-forward skipped hours advance to the next valid local time.
    - cron: "0 2 * * *"
      timezone: America/Detroit
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: siteimprove-refresh
  cancel-in-progress: false

jobs:
  refresh:
    # A staging/manual branch must never publish to main or trigger live sync.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Collect and validate complete observation
        id: collection
        env:
          SITEIMPROVE_EMAIL: ${{ secrets.SITEIMPROVE_EMAIL }}
          SITEIMPROVE_API_KEY: ${{ secrets.SITEIMPROVE_API_KEY }}
          SITEIMPROVE_MAX_WORKERS: ${{ vars.SITEIMPROVE_MAX_WORKERS || '8' }}
          SITEIMPROVE_TIMEOUT: ${{ vars.SITEIMPROVE_TIMEOUT || '120' }}
          SITEIMPROVE_OUTPUT_DIR: ${{ runner.temp }}/siteimprove-collection
        run: |
          mkdir -p "$SITEIMPROVE_OUTPUT_DIR"
          cp data/site-departments.csv "$SITEIMPROVE_OUTPUT_DIR/"
          python scripts/fetch_siteimprove.py
          python scripts/progress_history.py --data-dir "$SITEIMPROVE_OUTPUT_DIR"

      - name: Publish observation or failed-attempt status
        if: ${{ always() && !cancelled() }}
        id: publish
        env:
          COLLECTION_SUCCESS: ${{ steps.collection.outcome == 'success' }}
        run: |
          if [ "$COLLECTION_SUCCESS" = "true" ]; then
            python scripts/publish_progress.py --collection "$RUNNER_TEMP/siteimprove-collection" --success
          else
            python scripts/publish_progress.py --collection "$RUNNER_TEMP/siteimprove-collection"
          fi

      - name: Publish encrypted dashboard and refresh status
        if: ${{ always() && steps.publish.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run pages.yml --ref main

      # Asana's workflow_run handler syncs only successful main-branch runs.
