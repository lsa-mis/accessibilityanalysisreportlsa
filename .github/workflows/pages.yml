name: Deploy static site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The dashboard is password protected: only data.html and encrypted
      # copies of the snapshots are published — never the plain JSON, the
      # tag CSV or source-data/. The password is the DASHBOARD_PASSWORD
      # repo secret; data.html decrypts in the browser.
      #
      # The narrative report (index.html) is unpublished for now: the site
      # root redirects to the dashboard instead.
      - name: Build site
        env:
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
        run: |
          pip install cryptography
          mkdir -p _site/data
          cp data.html progress.html progress-core.js progress-client.js progress-page.js progress-widget.js progress.css favicon.svg _site/
          python scripts/encrypt_data.py _site/data
          cat > _site/index.html <<'EOF'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <title>LSA Web Accessibility Dashboard</title>
            <meta http-equiv="refresh" content="0; url=data.html">
            <link rel="canonical" href="data.html">
          </head>
          <body>
            <p><a href="data.html">Go to the LSA Web Accessibility Dashboard</a></p>
          </body>
          </html>
          EOF

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
